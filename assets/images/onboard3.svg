<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Concentric Background Rings -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="120" cy="120" r="65" fill="#F0FDF4" opacity="0.6"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#A7F3D0" stroke-width="1"/>

  <!-- Sparkles -->
  <path d="M 50 105 Q 55 105 55 100 Q 55 105 60 105 Q 55 105 55 110 Q 55 105 50 105" fill="#10B981"/>
  <path d="M 70 85 Q 73 85 73 82 Q 73 85 76 85 Q 73 85 73 88 Q 73 85 70 85" fill="#6EE7B7"/>
  <path d="M 185 110 Q 189 110 189 106 Q 189 110 193 110 Q 189 110 189 114 Q 189 110 185 110" fill="#10B981" opacity="0.8"/>

  <!-- Magnifying Glass (Scaled Down and Recentered) -->
  <!-- Handle -->
  <line x1="130" y1="130" x2="154" y2="154" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Lens -->
  <circle cx="110" cy="110" r="28" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
  
  <!-- Code Brackets inside Lens -->
  <polyline points="100,102 90,110 100,118" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="108" y1="122" x2="114" y2="98" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <polyline points="120,102 130,110 120,118" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Green Checkmark Badge -->
  <circle cx="148" cy="148" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
  <polyline points="141,148 146,153 155,143" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
